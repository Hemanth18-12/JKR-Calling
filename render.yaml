services:
  - type: web
    name: jkr-api
    runtime: python
    region: singapore
    plan: free
    rootDir: services/api
    buildCommand: "pip install uv && uv sync --all-packages"
    startCommand: "uv run alembic -c ../../packages/db/alembic.ini upgrade head && uv run --package jkr-db python -m jkr_db.seed && uv run --package jkr-api uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jkr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jkr-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_LIVE_CALLS
        value: "true"
      - key: AUTHORIZED_TEST_NUMBERS
        value: "+916301567773,+918074634178,+919742682839,+918019101606,+919100664228,+919704917948,*"

  - type: redis
    name: jkr-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: jkr-postgres
    databaseName: jkr_ai_calling
    user: jkr_app
    region: singapore
    plan: free
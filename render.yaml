services:
  - type: web
    name: jkr-api
    runtime: python
    region: singapore
    plan: free
    rootDir: services/api
    buildCommand: "export PATH=\"$HOME/.local/bin:$HOME/.cargo/bin:/opt/render/.local/bin:$PATH\" && (command -v uv >/dev/null 2>&1 || pip install uv) && uv sync --package jkr-api --no-dev"
    startCommand: "export PATH=\"$HOME/.local/bin:$HOME/.cargo/bin:/opt/render/.local/bin:$PATH\" && (uv run alembic -c ../../packages/db/alembic.ini upgrade head || true) && (uv run --package jkr-db python -m jkr_db.seed || true) && uv run --package jkr-api uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: UV_LINK_MODE
        value: "copy"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: jkr-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: ENABLE_LIVE_CALLS
        value: "true"
      - key: API_BASE_URL
        value: "https://jkr-api.onrender.com"
      - key: PUBLIC_WEBHOOK_BASE_URL
        value: "https://jkr-api.onrender.com"
      - key: AUTHORIZED_TEST_NUMBERS
        value: "+916301567773,+918074634178,+919742682839,+918019101606,+919100664228,+919704917948,*"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_TTS_API_KEY
        sync: false
      - key: DOGRAH_API_URL
        value: "http://localhost:8002"

  - type: redis
    name: jkr-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: jkr-postgres
    databaseName: jkr_ai_calling
    user: jkr_app
    region: singapore
    plan: free
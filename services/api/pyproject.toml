[project]
name = "jkr-api"
version = "0.1.0"
description = "JKR AI Calling — business API (the only backend surface the browser talks to)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jkr-db",
  "jkr-messaging",
  "jkr-conversation",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "email-validator>=2.2.0",
  "argon2-cffi>=23.1.0",
  "redis>=5.0.8",
  "httpx>=0.27.2",
  "cryptography>=43.0.1",
  "python-multipart>=0.0.9",
  "phonenumbers>=8.13.45",
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
  "beautifulsoup4>=4.12.3",
  "dramatiq[redis]>=1.17.1",
  "sse-starlette>=2.1.3",
  "websockets>=13.0",
]

[tool.uv.sources]
jkr-db = { workspace = true }
jkr-messaging = { workspace = true }
jkr-conversation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-httpx>=0.30.0",
]

[project]
name = "jkr-voice-worker"
version = "0.1.0"
description = "JKR AI Calling — real-time voice/conversation engine (its own process, its own failure domain)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jkr-db",
  "jkr-messaging",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "httpx>=0.27.2",
  "sse-starlette>=2.1.3",
]

[tool.uv.sources]
jkr-db = { workspace = true }
jkr-messaging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[project]
name = "jkr-intelligence-worker"
version = "0.1.0"
description = "JKR AI Calling — post-call intelligence pipeline (Dramatiq actors: summary, extraction validation, outcome, lead scoring, quality evaluation, follow-up planning)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jkr-db",
  "jkr-messaging",
  "dramatiq[redis]>=1.17.1",
  "pydantic-settings>=2.5.2",
]

[tool.uv.sources]
jkr-db = { workspace = true }
jkr-messaging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

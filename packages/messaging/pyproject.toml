[project]
name = "jkr-messaging"
version = "0.1.0"
description = "Shared Dramatiq broker config + a name-based enqueue helper — the thin contract between services/api (producer) and the *-worker services (consumers), so a producer never has to import a consumer's implementation package to enqueue a job for it."
requires-python = ">=3.12,<3.13"
dependencies = [
  "dramatiq[redis]>=1.17.1",
  "redis>=5.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jkr_messaging"]

[project]
name = "jkr-db"
version = "0.1.0"
description = "Shared SQLAlchemy models + Alembic migrations for JKR AI Calling"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.35",
  "greenlet>=3.1.1",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "pgvector>=0.3.4",
  "python-dotenv>=1.0.1",
  "phonenumbers>=8.13.45",
  "cryptography>=43.0.1",
  "httpx>=0.27.2",
  "argon2-cffi>=23.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jkr_db"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[project]
name = "jkr-conversation"
version = "0.1.0"
description = "Shared conversation-intelligence engine — extraction, RAG, planning, and response generation for one phone/chat turn, called identically by services/voice-worker (Test Lab / mock calls) and services/api (real Twilio calls) so both share the exact one implementation, the same reasoning as jkr_db.safety_gate/tools_engine/webhook_engine."
requires-python = ">=3.12,<3.13"
dependencies = [
  "jkr-db",
  "httpx>=0.27.2",
]

[tool.uv.sources]
jkr-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jkr_conversation"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

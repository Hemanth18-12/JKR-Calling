name: jkr-ai-calling

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jkr_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-jkr_ai_calling}
    ports:
      # Host 55432 -> container 5432: this machine already runs a native
      # Postgres on 5432, so the compose stack is remapped to avoid clashing
      # with it. Internal service-to-service traffic still uses port 5432.
      - "55432:5432"
    volumes:
      - jkr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jkr} -d ${POSTGRES_DB:-jkr_ai_calling}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host 16379 -> container 6379: this machine already runs a native Redis
      # on 6379. Internal service-to-service traffic still uses port 6379.
      - "16379:6379"
    volumes:
      - jkr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-jkr_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-jkr_minio_local_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - jkr_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dograh real-time voice engine (replaces LiveKit Agents)
  # Provides low-latency real-time voice streaming with native Sarvam STT/TTS
  # and telephony (Twilio & Exotel), integrated with Postgres, Redis, and MinIO.
  dograh-api:
    image: ${DOGRAH_REGISTRY:-ghcr.io/dograh-hq}/dograh-api:latest
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      LOG_LEVEL: "INFO"
      DATABASE_URL: "postgresql://${APP_DB_USER:-jkr_app}:${APP_DB_PASSWORD:-jkr_app_local_dev}@postgres:5432/${POSTGRES_DB:-jkr_ai_calling}"
      REDIS_URL: "redis://redis:6379/0"
      S3_ENDPOINT_URL: "http://minio:9000"
      SARVAM_API_KEY: "${SARVAM_API_KEY}"
      SARVAM_TTS_API_KEY: "${SARVAM_TTS_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
      EXOTEL_API_KEY: "${EXOTEL_API_KEY:-}"
      EXOTEL_API_TOKEN: "${EXOTEL_API_TOKEN:-}"
      EXOTEL_SUBDOMAIN: "${EXOTEL_SUBDOMAIN:-}"
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  dograh-ui:
    image: ${DOGRAH_REGISTRY:-ghcr.io/dograh-hq}/dograh-ui:latest
    environment:
      BACKEND_API_ENDPOINT: "http://dograh-api:8000"
    ports:
      - "3001:3000"
    depends_on:
      - dograh-api

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-jkr_app}:${APP_DB_PASSWORD:-jkr_app_local_dev}@postgres:5432/${POSTGRES_DB:-jkr_ai_calling}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      VOICE_WORKER_BASE_URL: http://voice-worker:8100
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
      - ./packages/db:/app/packages/db

  voice-worker:
    build:
      context: .
      dockerfile: infra/docker/voice-worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-jkr_app}:${APP_DB_PASSWORD:-jkr_app_local_dev}@postgres:5432/${POSTGRES_DB:-jkr_ai_calling}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/voice-worker:/app/services/voice-worker
      - ./packages/db:/app/packages/db

  campaign-worker:
    build:
      context: .
      dockerfile: infra/docker/campaign-worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-jkr_app}:${APP_DB_PASSWORD:-jkr_app_local_dev}@postgres:5432/${POSTGRES_DB:-jkr_ai_calling}
      REDIS_URL: redis://redis:6379/0
      VOICE_WORKER_BASE_URL: http://voice-worker:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/campaign-worker:/app/services/campaign-worker
      - ./packages/db:/app/packages/db

  intelligence-worker:
    build:
      context: .
      dockerfile: infra/docker/intelligence-worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-jkr_app}:${APP_DB_PASSWORD:-jkr_app_local_dev}@postgres:5432/${POSTGRES_DB:-jkr_ai_calling}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/intelligence-worker:/app/services/intelligence-worker
      - ./packages/db:/app/packages/db

  integration-worker:
    build:
      context: .
      dockerfile: infra/docker/integration-worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-jkr_app}:${APP_DB_PASSWORD:-jkr_app_local_dev}@postgres:5432/${POSTGRES_DB:-jkr_ai_calling}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/integration-worker:/app/services/integration-worker
      - ./packages/db:/app/packages/db

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_APP_ENV: local
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages

volumes:
  jkr_postgres_data:
  jkr_redis_data:
  jkr_minio_data:
